# Coolify-native compose (also usable with plain `docker compose up`):
# one container + one small volume holding both the SQLite database file
# and uploaded images/PDFs. No separate database service is needed.
#
# On Coolify: create the resource from this repo/compose file, assign the
# site's domain (https://tampere.kayttajayhteiso.fi) to the "app" service
# in the Coolify UI (it detects the exposed port below), and set APP_URL to
# that same https:// domain — it's used to build absolute image URLs inside
# generated PDFs. Do not add a host port mapping here; Coolify's Traefik
# reaches the container on the internal compose network.
#
# Plain self-hosting without Coolify/a reverse proxy in front: add
# `ports: ["3000:3000"]` under the app service, or run
# `docker compose run --service-ports app`.
services:
  app:
    build: .
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      APP_URL: ${APP_URL:?Set APP_URL to this app's public https:// domain}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
    volumes:
      - kk2-data:/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  kk2-data:
